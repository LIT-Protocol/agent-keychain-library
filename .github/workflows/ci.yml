name: CI
# No secrets are used or needed: the catalog is validated, linted, type-checked
# and exercised against in-memory upstreams. Live provider calls happen only in
# the Keychain repository against a pinned release of this package.
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm test
      # dist/ is committed because Keychain consumes this repo as a source tarball.
      - run: npm run build && git diff --exit-code -- dist
